info:
  name: CUTECH-5522 - Retrieve a descriptor
  type: http
  seq: 15

http:
  method: GET
  url: https://platform.adobe.io/data/foundation/schemaregistry/{{CONTAINER_ID}}/descriptors/{{DESCRIPTOR_ID}}
  headers:
    - name: Accept
      value: application/vnd.adobe.xdm-id+json
    - name: x-api-key
      value: "{{AEP_CLIENT_ID}}"
    - name: x-gw-ims-org-id
      value: "{{AEP_IMS_ORG}}"
    - name: x-sandbox-name
      value: "{{AEP_SANDBOX_NAME}}"

auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

    - expression: res.body
      operator: isJson

  scripts:
  - type: tests
    code: |-
      test("CUTECH-5522", function () {
        expect(true).to.equal(true);
      });



settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
