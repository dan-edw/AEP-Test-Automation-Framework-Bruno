info:
  name: CUTECH-4195 - List behaviours
  type: http
  seq: 2

http:
  method: GET
  url: https://platform.adobe.io/data/foundation/schemaregistry/global/behaviors
  headers:
    - name: Accept
      value: application/vnd.adobe.xed-id+json
    - name: Content-Type
      value: application/json
    - name: x-api-key
      value: "{{AEP_CLIENT_ID}}"
    - name: x-gw-ims-org-id
      value: "{{AEP_IMS_ORG}}"
    - name: x-sandbox-name
      value: "{{AEP_SANDBOX_NAME}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

    - expression: res.body
      operator: isJson

    - expression: res.body.results
      operator: isArray

  scripts:
  - type: tests
    code: |-
      test("CUTECH-4195", function () {
        expect(true).to.equal(true);
      });


settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
