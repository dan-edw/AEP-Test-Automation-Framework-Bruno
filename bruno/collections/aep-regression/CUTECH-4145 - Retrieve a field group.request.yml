info:
  name: CUTECH-4145 - Retrieve a field group
  type: http
  seq: 5

http:
  method: GET
  url: https://platform.adobe.io/data/foundation/schemaregistry/:CONTAINER_ID/fieldgroups/:FIELD_GROUP_ID
  headers:
    - name: Accept
      value: application/vnd.adobe.xed-id+json
    - name: Content-Type
      value: application/json
    - name: x-api-key
      value: "{{AEP_CLIENT_ID}}"
    - name: x-gw-ims-org-id
      value: "{{AEP_IMS_ORG}}"
    - name: x-sandbox-name
      value: "{{AEP_SANDBOX_NAME}}"
  params:
    - name: CONTAINER_ID
      value: "{{CONTAINER_ID}}"
      type: path
    - name: FIELD_GROUP_ID
      value: "{{FIELD_GROUP_ID}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
