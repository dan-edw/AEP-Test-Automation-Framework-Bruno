info:
  name: CUTECH-4143 - List schemas
  type: http
  seq: 3

http:
  method: GET
  url: https://platform.adobe.io/data/foundation/schemaregistry/:CONTAINER_ID/schemas

  headers:
    - name: Accept
      value: application/vnd.adobe.xed-id+json
    - name: Content-Type
      value: application/json
    - name: x-api-key
      value: "{{AEP_CLIENT_ID}}"
    - name: x-gw-ims-org-id
      value: "{{AEP_IMS_ORG}}"
    - name: x-sandbox-name
      value: "{{AEP_SANDBOX_NAME}}"

  params:
    - name: CONTAINER_ID
      value: "{{CONTAINER_ID}}"
      type: path

    
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

    - expression: res.body
      operator: isJson

    - expression: res.body.results
      operator: isArray

  scripts:
  - type: tests
    code: |-
      test("CUTECH-4143", function () {
        const assertions = bru.getAssertionResults();

        const failedAssertions = assertions.filter(
          assertion => assertion.status === "fail"
        );

        if (failedAssertions.length > 0) {
          throw new Error(
            failedAssertions.length +
            " declarative assertion(s) failed"
          );
        }
      });



settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
