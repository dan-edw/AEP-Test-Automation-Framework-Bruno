info:
  name: CUTECH-4188 - Retrieve a list of batches
  type: http
  seq: 5

http:
  method: GET
  url: https://platform.adobe.io/data/foundation/catalog/batches?status={{status}}&recordCount={{recordCount}}&failedRecordCount={{failedRecordCount}}&size={{size}}&started={{started}}&completed={{completed}}&startAfter={{startAfter}}&startBefore={{startBefore}}&endAfter={{endAfter}}&endBefore={{endBefore}}&batch={{batch}}&externalId={{externalId}}&connection={{connection}}&connector={{connector}}&dataSet={{dataSet}}
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: x-api-key
      value: "{{AEP_CLIENT_ID}}"
    - name: x-gw-ims-org-id
      value: "{{AEP_IMS_ORG}}"
    - name: x-sandbox-name
      value: "{{AEP_SANDBOX_NAME}}"
  params:
    - name: CONTAINER_ID
      value: "{{CONTAINER_ID}}"
      type: path
    - name: FIELD_GROUP_ID
      value: "{{FIELD_GROUP_ID}}"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

    - expression: res.body
      operator: isJson

  scripts:
  - type: tests
    code: |-
      test("CUTECH-4188 - Retrieve a list of batches", function () {
        expect(true).to.equal(true);
      });



settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
