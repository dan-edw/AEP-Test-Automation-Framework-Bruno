info:
  name: CUTECH-4144 - Retrieve a schema
  type: http
  seq: 4

http:
  method: GET
  url: https://platform.adobe.io/data/foundation/schemaregistry/:CONTAINER_ID/schemas/:SCHEMA_ID
  headers:
    - name: Accept
      value: application/vnd.adobe.xed-id+json
    - name: Content-Type
      value: application/json
    - name: x-api-key
      value: "{{AEP_CLIENT_ID}}"
    - name: x-gw-ims-org-id
      value: "{{AEP_IMS_ORG}}"
    - name: x-sandbox-name
      value: "{{AEP_SANDBOX_NAME}}"
  params:
    - name: CONTAINER_ID
      value: "{{CONTAINER_ID}}"
      type: path
    - name: SCHEMA_ID
      value: "{{SCHEMA_ID}}"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

  scripts:
    - type: tests
      code: |-
        test("CUTECH-4144", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
