opencollection: 1.0.0

info:
  name: AEP Regression

request:
  scripts:
    - type: before-request
      code: |-
        let token = bru.getVar("ACCESS_TOKEN");

        if (!token) {
          console.log("ACCESS_TOKEN not available. Requesting Adobe access token...");

          const clientId = bru.getVar("AEP_CLIENT_ID");
          const clientSecret = bru.getVar("AEP_CLIENT_SECRET");
          const scope = bru.getVar("AEP_SCOPE");

          if (!clientId) {
            throw new Error("AEP_CLIENT_ID is not available");
          }

          if (!clientSecret) {
            throw new Error("AEP_CLIENT_SECRET is not available");
          }

          if (!scope) {
            throw new Error("AEP_SCOPE is not available");
          }

          console.log("AEP_CLIENT_ID exists:", !!clientId);
          console.log("AEP_CLIENT_SECRET exists:", !!clientSecret);
          console.log("AEP_SCOPE exists:", !!scope);

          const body =
            "grant_type=client_credentials" +
            "&client_id=" + encodeURIComponent(clientId) +
            "&client_secret=" + encodeURIComponent(clientSecret) +
            "&scope=" + encodeURIComponent(scope);

          const authResponse = await bru.sendRequest({
            method: "POST",
            url: "https://ims-na1.adobelogin.com/ims/token/v3",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded"
            },
            data: body
          });

          console.log("Adobe authentication status:", authResponse.status);

          if (authResponse.status !== 200) {
            console.log("Adobe authentication response:", authResponse.data);
            throw new Error(
              "Adobe authentication failed with HTTP " + authResponse.status
            );
          }

          token = authResponse.data?.access_token;

          if (!token) {
            throw new Error("Adobe authentication response did not contain access_token");
          }

          bru.setVar("ACCESS_TOKEN", token);

          console.log("ACCESS_TOKEN successfully acquired.");
          console.log("Token length:", token.length);
        }

        req.setHeader("Authorization", "Bearer " + token);
