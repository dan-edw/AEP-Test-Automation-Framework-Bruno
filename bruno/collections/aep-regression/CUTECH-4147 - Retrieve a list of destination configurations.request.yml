info:
  name: CUTECH-4147 - Retrieve a list of destination configurations
  type: http
  seq: 6

http:
  method: GET
  url: https://platform.adobe.io/data/core/activation/authoring/destinations
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: x-api-key
      value: "{{AEP_CLIENT_ID}}"
    - name: x-gw-ims-org-id
      value: "{{AEP_IMS_ORG}}"
    - name: x-sandbox-name
      value: "{{AEP_SANDBOX_NAME}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

    - expression: res.body
      operator: isJson

  scripts:
    - type: tests
      code: |-
        test("CUTECH-4147", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
