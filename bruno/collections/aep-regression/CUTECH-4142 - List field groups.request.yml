info:
  name: CUTECH-4142 - List field groups
  type: http
  seq: 2

http:
  method: GET
  url: https://platform.adobe.io/data/foundation/schemaregistry/:CONTAINER_ID/fieldgroups
  headers:
    - name: Accept
      value: application/vnd.adobe.xed-id+json
    - name: Content-Type
      value: application/json
    - name: x-api-key
      value: "{{AEP_CLIENT_ID}}"
    - name: x-gw-ims-org-id
      value: "{{AEP_IMS_ORG}}"
    - name: x-sandbox-name
      value: "{{AEP_SANDBOX_NAME}}"
  params:
    - name: CONTAINER_ID
      value: "{{CONTAINER_ID}}"
      type: path

runtime:
  scripts:
    - type: after-response
      code: |-
        test("CUTECH-4142", function () {
          // Expected Status
          expect(res.getStatus()).to.equal(200);

          // Valid JSON
          const body = res.getBody();

          if (typeof body === "string") {
            expect(() => JSON.parse(body)).to.not.throw();
          } else {
            expect(body).to.satisfy(
              value => value !== null && typeof value === "object"
            );
          }

          // Array Response
          const json = typeof body === "string"
            ? JSON.parse(body)
            : body;

          expect(json).to.be.an("array");
        });




settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
