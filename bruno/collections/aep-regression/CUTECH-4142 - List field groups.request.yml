info:
  name: CUTECH-4142 - List field groups
  type: http
  seq: 2

http:
  method: GET
  url: https://platform.adobe.io/data/foundation/schemaregistry/:CONTAINER_ID/fieldgroups
  headers:
    - name: Accept
      value: application/vnd.adobe.xed-id+json
    - name: Content-Type
      value: application/json
    - name: x-api-key
      value: "{{AEP_CLIENT_ID}}"
    - name: x-gw-ims-org-id
      value: "{{AEP_IMS_ORG}}"
    - name: x-sandbox-name
      value: "{{AEP_SANDBOX_NAME}}"
  params:
    - name: CONTAINER_ID
      value: "{{CONTAINER_ID}}"
      type: path

runtime:
  scripts:
    - type: after-response
      code: |-
        test("CUTECH-4142", function () {
          const checks = [];

          function check(name, assertion) {
            try {
              assertion();

              checks.push({
                name,
                status: "PASS"
              });
            } catch (error) {
              checks.push({
                name,
                status: "FAIL",
                error: error.message
              });
            }
          }

          const body = res.getBody();

          check("Expected HTTP status is 200", function () {
            expect(res.getStatus()).to.equal(200);
          });

          check("Response is valid JSON", function () {
            if (typeof body === "string") {
              expect(() => JSON.parse(body)).to.not.throw();
            } else {
              expect(body).to.satisfy(
                value => value !== null && typeof value === "object"
              );
            }
          });

          check("Response results is an array", function () {
            const json =
              typeof body === "string"
                ? JSON.parse(body)
                : body;

            expect(json.results).to.be.an("array");
          });


          const summary = checks
            .map(check => {
              if (check.status === "PASS") {
                return `PASS: ${check.name}`;
              }

              return `FAIL: ${check.name}\n  Error: ${check.error}`;
            })
            .join("\n");

          const failures = checks.filter(
            check => check.status === "FAIL"
          );

          if (failures.length > 0) {
            throw new Error("\n" + summary);
          }
        });





settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
