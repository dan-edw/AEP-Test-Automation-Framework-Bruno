info:
  name: CUTECH-4142 - List field groups
  type: http
  seq: 2

http:
  method: GET
  url: https://platform.adobe.io/data/foundation/schemaregistry/:CONTAINER_ID/fieldgroups
  headers:
    - name: Accept
      value: application/vnd.adobe.xed-id+json
    - name: Content-Type
      value: application/json
    - name: x-api-key
      value: "{{AEP_CLIENT_ID}}"
    - name: x-gw-ims-org-id
      value: "{{AEP_IMS_ORG}}"
    - name: x-sandbox-name
      value: "{{AEP_SANDBOX_NAME}}"
  params:
    - name: CONTAINER_ID
      value: "{{CONTAINER_ID}}"
      type: path

runtime:
  scripts:
    - type: before-request
      code: |-
        const token = bru.getVar("ACCESS_TOKEN");

        if (!token) {
          throw new Error("ACCESS_TOKEN is not available");
        }

        req.setHeader("Authorization", `Bearer ${token}`);

        console.log("Authorization header set.");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
