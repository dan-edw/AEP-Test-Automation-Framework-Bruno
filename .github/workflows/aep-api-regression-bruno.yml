name: AEP API Regression

on:

  workflow_dispatch:
    inputs:
      environment:
        description: Test Environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - uat
          - prod

  push:
    branches:
      - main
      - Updates

  pull_request:
    branches:
      - main
      - Updates


jobs:

  test:

    name: Run AEP API Regression

    runs-on: ubuntu-latest

    # Use the selected GitHub environment.
    # For push/PR, default to dev.
    environment: ${{ github.event.inputs.environment || 'dev' }}
    timeout-minutes: 30


    steps:

      # ----------------------------------------
      # 1. Checkout repository
      # ----------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      
      # ----------------------------------------
      # 2. Mask sensitive values
      # ----------------------------------------
    
      - name: Mask sensitive values
        shell: bash
        env:
          AEP_CLIENT_ID: ${{ secrets.AEP_CLIENT_ID }}
          AEP_CLIENT_SECRET: ${{ secrets.AEP_CLIENT_SECRET }}
          AEP_IMS_ORG: ${{ secrets.AEP_IMS_ORG }}
        run: |
          echo "::add-mask::$AEP_CLIENT_ID"
          echo "::add-mask::$AEP_CLIENT_SECRET"
          echo "::add-mask::$AEP_IMS_ORG"
      
      
      
      # ----------------------------------------
      # 3. Inspect Bruno files
      # ----------------------------------------

      - name: Inspect Bruno files
        shell: bash
        run: |
          echo "=== Bruno files ==="
          find bruno -maxdepth 6 -type f | sort

          echo ""
          echo "=== Collection directory ==="
          ls -la bruno/collections/aep-regression

          echo ""
          echo "=== Verify collection root ==="
          test -f bruno/collections/aep-regression/opencollection.yml || {
            echo "ERROR: opencollection.yml not found"
            exit 1
          }

          cat bruno/collections/aep-regression/opencollection.yml


      # ----------------------------------------
      # 4. Prepare Bruno Environment
      # ----------------------------------------

      - name: Prepare Bruno Environment
        id: environment
        shell: bash
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"

          echo "Running AEP API Regression against: $ENVIRONMENT"

          ENV_FILE="${{ github.workspace }}/bruno/environments/${ENVIRONMENT}.json"

          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: Bruno environment not found: $ENV_FILE"
            exit 1
          fi

          echo "Using Bruno environment: $ENV_FILE"
          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_OUTPUT"


      
      # ----------------------------------------
      # 5. Install Bruno CLI
      # ----------------------------------------
      
      - name: Install Bruno CLI
        shell: bash
        run: |
          npm install -g @usebruno/cli@4.1.0
          bru --version

      
      
      # ----------------------------------------
      # 6. Run Bruno Collection
      # ----------------------------------------

      - name: Run AEP API Regression
        id: bruno
        shell: bash
        working-directory: bruno/collections/aep-regression
        run: |
          set +e

          bru run \
            --env-file "${{ steps.environment.outputs.ENV_FILE }}" \
            --env-var "AEP_CLIENT_ID=${{ secrets.AEP_CLIENT_ID }}" \
            --env-var "AEP_CLIENT_SECRET=${{ secrets.AEP_CLIENT_SECRET }}" \
            --env-var "AEP_SCOPE=${{ secrets.AEP_SCOPE }}" \
            --env-var "AEP_IMS_ORG=${{ secrets.AEP_IMS_ORG }}" \
            --env-var "AEP_SANDBOX_NAME=${{ vars.AEP_SANDBOX_NAME }}" \
            --env-var "CONTAINER_ID=tenant" \
            --reporter-junit test-results.xml \
            --reporter-json bruno-results.json \
            --reporter-skip-headers "Authorization"

          BRUNO_EXIT_CODE=$?

          echo "Bruno exit code: $BRUNO_EXIT_CODE"
          echo "exit_code=$BRUNO_EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ ! -f "test-results.xml" ]; then
            echo "ERROR: Bruno did not generate test-results.xml"
            exit 1
          fi

          if [ ! -f "bruno-results.json" ]; then
            echo "ERROR: Bruno did not generate bruno-results.json"
            exit 1
          fi

          TOTAL=$(grep -o '<testcase ' test-results.xml | wc -l | tr -d ' ' || true)
          FAILED=$(grep -o '<failure ' test-results.xml | wc -l | tr -d ' ' || true)

          PASSED=$((TOTAL - FAILED))

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=== Bruno Regression Result ==="
          echo "Passed: $PASSED"
          echo "Failed: $FAILED"
          echo "Total:  $TOTAL"
          echo ""
          echo "Test failures are reported in Xray and do not fail this GitHub step."

          exit 0



  
      # ----------------------------------------
      # 7. Generate Bruno Test Summary
      # ----------------------------------------
          
      - name: Prepare Bruno Reports
        if: always()
        shell: bash
        run: |
          echo "=== Bruno results ==="
          echo "Exit code: ${{ steps.bruno.outputs.exit_code }}"
          echo "Passed:    ${{ steps.bruno.outputs.passed }}"
          echo "Failed:    ${{ steps.bruno.outputs.failed }}"
          echo "Total:     ${{ steps.bruno.outputs.total }}"

          if [ -f "bruno/collections/aep-regression/test-results.xml" ]; then
            cp bruno/collections/aep-regression/test-results.xml test-results.xml
          else
            echo "ERROR: Bruno JUnit report was not created"
            exit 1
          fi

          if [ -f "bruno/collections/aep-regression/bruno-results.json" ]; then
            cp bruno/collections/aep-regression/bruno-results.json bruno-results.json
          else
            echo "ERROR: Bruno JSON report was not created"
            exit 1
          fi

          echo ""
          echo "=== JUnit ==="
          cat test-results.xml


      # ----------------------------------------
      # 8. Add Xray Test Keys to JUnit
      # ----------------------------------------

      - name: Add Xray Test Keys to JUnit
        shell: bash
        run: |
          python3 <<'PY'
          import re
          import xml.etree.ElementTree as ET

          path = "test-results.xml"

          tree = ET.parse(path)
          root = tree.getroot()

          kept = 0
          removed = 0

          for testsuite in list(root.findall("testsuite")):
            testcases = list(testsuite.findall("testcase"))

            for testcase in testcases:
              name = testcase.get("name", "")

              match = re.search(r'\b(CUTECH-\d+)\b', name)

              # Remove Bruno declarative assertion rows from the JUnit
              # that will be sent to Xray.
              if not match:
                testsuite.remove(testcase)
                removed += 1
                continue

              test_key = match.group(1)

              properties = testcase.find("properties")

              if properties is None:
                properties = ET.Element("properties")
                testcase.insert(0, properties)

              existing = properties.find("./property[@name='test_key']")

              if existing is None:
                prop = ET.SubElement(properties, "property")
                prop.set("name", "test_key")
                prop.set("value", test_key)
              else:
                existing.set("value", test_key)

              print(f"Mapped {name} -> {test_key}")
              kept += 1

            # Recalculate this suite after removing assertion-generated rows
            remaining = list(testsuite.findall("testcase"))

            # If the suite contained only Bruno assertions, remove the suite
            if not remaining:
              root.remove(testsuite)
              continue

            failures = sum(
              1
              for testcase in remaining
              if testcase.find("failure") is not None
            )

            errors = sum(
              1
              for testcase in remaining
              if testcase.find("error") is not None
            )

            skipped = sum(
              1
              for testcase in remaining
              if testcase.find("skipped") is not None
            )

            testsuite.set("tests", str(len(remaining)))
            testsuite.set("failures", str(failures))
            testsuite.set("errors", str(errors))
            testsuite.set("skipped", str(skipped))

          if kept == 0:
            raise SystemExit(
              "ERROR: No Jira/Xray testcase keys were found in JUnit"
            )

          tree.write(
            path,
            encoding="utf-8",
            xml_declaration=True
          )

          print("")
          print(f"Xray testcases kept: {kept}")
          print(f"Bruno assertion testcases removed: {removed}")
          PY

          echo ""
          echo "=== Xray-ready JUnit ==="
          cat test-results.xml



      
      # ----------------------------------------
      # 9. Authenticate with Xray Cloud
      # ----------------------------------------
      
      - name: Authenticate with Xray Cloud
        if: always()
        id: xray-auth
        shell: bash
        run: |
          TOKEN=$(curl -s \
            -H "Content-Type: application/json" \
            -X POST \
            https://xray.cloud.getxray.app/api/v2/authenticate \
            -d '{
              "client_id":"${{ secrets.XRAY_CLIENT_ID }}",
              "client_secret":"${{ secrets.XRAY_CLIENT_SECRET }}"
            }')

          TOKEN=$(echo "$TOKEN" | tr -d '"')

          echo "XRAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          echo "Authentication successful"
      
      
      # ----------------------------------------
      # 10. Check Xray JUnit file
      # ----------------------------------------    
      
      - name: Check Xray JUnit file
        if: always()
        shell: bash
        run: |
          echo "=== Current directory ==="
          pwd

          echo "=== Files ==="
          ls -la

          echo "=== JUnit file ==="
          if [ -f "test-results.xml" ]; then
            echo "test-results.xml exists"
            ls -lh test-results.xml
            echo "=== Contents ==="
            cat test-results.xml
          else
            echo "ERROR: test-results.xml does not exist"
            exit 1
          fi

      
      
      # ----------------------------------------
      # 11. Publish the Results to Xray
      # ----------------------------------------

      - name: Publish Results to Xray
        id: publish-xray
        if: always()
        shell: bash
        env:
          XRAY_TOKEN: ${{ env.XRAY_TOKEN }}
          XRAY_PROJECT_KEY: ${{ secrets.XRAY_PROJECT_KEY }}

        run: |
          set +e

          echo "=== Publishing JUnit Results to Xray ==="

          if [ -z "$XRAY_TOKEN" ]; then
            echo "ERROR: XRAY_TOKEN is empty"
            exit 1
          fi

          if [ -z "$XRAY_PROJECT_KEY" ]; then
            echo "ERROR: XRAY_PROJECT_KEY is empty"
            exit 1
          fi

          if [ ! -f "test-results.xml" ]; then
            echo "ERROR: test-results.xml does not exist"
            exit 1
          fi

          echo "Project: $XRAY_PROJECT_KEY"

          # --------------------------------------------------
          # Import JUnit results into Xray
          # --------------------------------------------------

          echo ""
          echo "=== Importing JUnit results into Xray ==="

          XRAY_IMPORT_URL="https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=${XRAY_PROJECT_KEY}"

          HTTP_CODE=$(curl -s \
            -o xray-import-response.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${XRAY_TOKEN}" \
            -H "Content-Type: text/xml" \
            --data-binary "@$(pwd)/test-results.xml" \
            "$XRAY_IMPORT_URL")

          echo "HTTP status: $HTTP_CODE"

          echo "=== Xray Import Response ==="
          cat xray-import-response.json
          echo ""

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: Xray JUnit import failed"
            exit 1
          fi
       

          # --------------------------------------------------
          # Save values for Step 12
          # --------------------------------------------------

          XRAY_EXECUTION_KEY=$(jq -r '.key // empty' xray-import-response.json)
          XRAY_EXECUTION_ID=$(jq -r '.id // empty' xray-import-response.json)

          echo "XRAY_EXECUTION_KEY=$XRAY_EXECUTION_KEY" >> "$GITHUB_OUTPUT"
          echo "XRAY_EXECUTION_ID=$XRAY_EXECUTION_ID" >> "$GITHUB_OUTPUT"


          echo ""
          echo "=== Xray import result ==="
          echo "Execution key: $XRAY_EXECUTION_KEY"
          echo "Execution ID: $XRAY_EXECUTION_ID"

          if [ -z "$XRAY_EXECUTION_KEY" ]; then
            echo "WARNING: Xray returned HTTP $HTTP_CODE but no Test Execution key."
            echo "Response:"
            cat xray-import-response.json
          else
            echo "SUCCESS: Xray Test Execution created/updated: $XRAY_EXECUTION_KEY"
          fi


      # ----------------------------------------
      # 12. Regression Summary
      # ----------------------------------------

      - name: Regression Summary
        if: always()
        shell: bash
        run: |
          if [ ! -f "test-results.xml" ]; then
            echo "No JUnit report found."
            exit 0
          fi

          if [ ! -f "bruno-results.json" ]; then
            echo "No Bruno JSON report found."
            exit 0
          fi

          # -----------------------------
          # Test Case counts from JUnit
          # -----------------------------

          TEST_CASE_TOTAL=$(grep -o '<testcase ' test-results.xml | wc -l | tr -d ' ' || true)

          TEST_CASE_FAILED=$(grep -o '<failure ' test-results.xml | wc -l | tr -d ' ' || true)

          TEST_CASE_PASSED=$((TEST_CASE_TOTAL - TEST_CASE_FAILED))


          # -----------------------------
          # Assertion counts from Bruno JSON
          # -----------------------------

          ASSERTION_TOTAL=$(jq '
            [.[].results[].assertionResults[]?]
            | length
          ' bruno-results.json)

          ASSERTION_PASSED=$(jq '
            [
              .[].results[].assertionResults[]?
              | select(.status == "pass")
            ]
            | length
          ' bruno-results.json)

          ASSERTION_FAILED=$(jq '
            [
              .[].results[].assertionResults[]?
              | select(.status == "fail")
            ]
            | length
          ' bruno-results.json)


          # -----------------------------
          # GitHub Summary
          # -----------------------------

          {
            echo "## 🧪 Regression Summary"
            echo ""

            echo "### Test Cases"
            echo ""
            echo "| Metric | Result |"
            echo "| --- | ---: |"
            echo "| 📋 Total Test Cases | $TEST_CASE_TOTAL |"
            echo "| ✅ Passed Test Cases | $TEST_CASE_PASSED |"
            echo "| ❌ Failed Test Cases | $TEST_CASE_FAILED |"
            echo ""

            echo "### Assertions"
            echo ""
            echo "| Metric | Result |"
            echo "| --- | ---: |"
            echo "| 📋 Total Assertions | $ASSERTION_TOTAL |"
            echo "| ✅ Passed Assertions | $ASSERTION_PASSED |"
            echo "| ❌ Failed Assertions | $ASSERTION_FAILED |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Test Cases: $TEST_CASE_TOTAL"
          echo "Passed Test Cases: $TEST_CASE_PASSED"
          echo "Failed Test Cases: $TEST_CASE_FAILED"

          echo "Assertions: $ASSERTION_TOTAL"
          echo "Passed Assertions: $ASSERTION_PASSED"
          echo "Failed Assertions: $ASSERTION_FAILED"


      
      # ----------------------------------------
      # 13. Add actual results / failure details to Xray Test Runs
      # ----------------------------------------

      - name: Update Xray Test Run Results
        if: ${{ always() && steps.publish-xray.outcome == 'success' }}
        shell: bash
        env:
          XRAY_TOKEN: ${{ env.XRAY_TOKEN }}
          XRAY_EXECUTION_ID: ${{ steps.publish-xray.outputs.XRAY_EXECUTION_ID }}
        run: |
          set -e

          echo "=== Updating Xray Test Run Results ==="
          echo "Execution ID: $XRAY_EXECUTION_ID"

          if [ -z "$XRAY_TOKEN" ]; then
            echo "ERROR: XRAY_TOKEN is empty"
            exit 1
          fi

          if [ -z "$XRAY_EXECUTION_ID" ]; then
            echo "ERROR: XRAY_EXECUTION_ID is empty"
            exit 1
          fi

          if [ ! -f "bruno-results.json" ]; then
            echo "ERROR: bruno-results.json does not exist"
            exit 1
          fi

          # --------------------------------------------------
          # Get Xray Test Runs created by the JUnit import
          # --------------------------------------------------

          MAX_ATTEMPTS=10
          TEST_RUN_COUNT=0

          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do

            echo ""
            echo "=== Getting Xray Test Runs (attempt $ATTEMPT/$MAX_ATTEMPTS) ==="

            RUN_QUERY=$(jq -n \
              --arg executionId "$XRAY_EXECUTION_ID" \
              '{
                query: (
                  "query { getTestRuns(testExecIssueIds: [" +
                  ($executionId | @json) +
                  "], limit: 100, start: 0) { total results { id status { name } test { issueId jira(fields: [\"key\"]) } testExecution { issueId } } } }"
                )
              }')

              HTTP_CODE=$(curl -s \
                -o xray-test-runs.json \
                -w "%{http_code}" \
                -X POST \
                -H "Authorization: Bearer ${XRAY_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$RUN_QUERY" \
                "https://xray.cloud.getxray.app/api/v2/graphql")

              echo "HTTP status: $HTTP_CODE"

              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then

                if jq -e '.errors? | length > 0' xray-test-runs.json >/dev/null 2>&1; then
                  echo "GraphQL returned errors:"
                  jq '.errors' xray-test-runs.json
                else
                  TEST_RUN_COUNT=$(jq -r '.data.getTestRuns.total // 0' xray-test-runs.json)

                  echo "Xray Test Runs found: $TEST_RUN_COUNT"

                  if [ "$TEST_RUN_COUNT" -gt 0 ]; then
                    break
                  fi
                fi
              fi

              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                echo "Test Runs not available yet. Waiting 3 seconds..."
                sleep 3
              fi
            done

            if [ "$TEST_RUN_COUNT" -eq 0 ]; then
              echo "ERROR: Xray Test Runs were not available."
              exit 1
            fi

            echo ""
            echo "=== Xray Test Run Mapping ==="

            jq -r '
              .data.getTestRuns.results[] |
              "\(.test.jira.key)|\(.id)|\(.status.name)"
            ' xray-test-runs.json

            # --------------------------------------------------
            # Process Bruno results
            # --------------------------------------------------

            UPDATED_COUNT=0
            FAILED_UPDATE_COUNT=0

            while IFS= read -r RESULT; do

              TEST_NAME=$(echo "$RESULT" | jq -r '.name // ""')

              TEST_KEY=$(echo "$TEST_NAME" |
                grep -oE 'CUTECH-[0-9]+' |
                head -n 1 || true)

              if [ -z "$TEST_KEY" ]; then
                echo ""
                echo "WARNING: Could not find Jira key in Bruno result:"
                echo "$TEST_NAME"
                continue
              fi

              BRUNO_STATUS=$(echo "$RESULT" | jq -r '.status // "unknown"')

              METHOD=$(echo "$RESULT" |
                jq -r '.request.method // .request.methodName // "N/A"')

              REQUEST_URL=$(echo "$RESULT" |
                jq -r '.request.url // "N/A"')

              HTTP_STATUS=$(echo "$RESULT" |
                jq -r '.response.status // .response.statusCode // "N/A"')

              RUN_DURATION=$(echo "$RESULT" |
                jq -r '.runDuration // "N/A"')

              # --------------------------------------------------
              # Collect Bruno post-response test results
              # --------------------------------------------------

                TEST_RUN_ID=$(jq -r \
                  --arg key "$TEST_KEY" '
                    .data.getTestRuns.results[]
                    | select(.test.jira.key == $key)
                    | .id
                  ' xray-test-runs.json | head -n 1)

                XRAY_STATUS=$(jq -r \
                  --arg key "$TEST_KEY" '
                    .data.getTestRuns.results[]
                    | select(.test.jira.key == $key)
                    | .status.name
                  ' xray-test-runs.json | head -n 1)

                echo ""
                echo "========================================"
                echo "Jira Test:      $TEST_KEY"
                echo "Bruno Test:     $TEST_NAME"
                echo "Bruno Status:   $BRUNO_STATUS"
                echo "HTTP Status:    $HTTP_STATUS"
                echo "Xray Status:    ${XRAY_STATUS:-UNKNOWN}"
                echo "Xray Test Run:  ${TEST_RUN_ID:-NOT FOUND}"
                echo "========================================"

                if [ -z "$TEST_RUN_ID" ]; then
                  echo "ERROR: No Xray Test Run found for $TEST_KEY"
                  FAILED_UPDATE_COUNT=$((FAILED_UPDATE_COUNT + 1))
                  continue
                fi

                # --------------------------------------------------
                # Build assertion details from Bruno JSON
                # --------------------------------------------------

                echo ""
                echo "=== Assertion JSON for $TEST_KEY ==="
                echo "$RESULT" | jq '.assertionResults // []'

                ASSERTION_DETAILS=$(echo "$RESULT" | jq -r '
                  (.assertionResults // [])
                  | if length == 0 then
                      "No declarative assertions captured"
                    else
                      map(
                        (
                          if (.status // "") == "pass" then
                            "PASS"
                          elif (.status // "") == "fail" then
                            "FAIL"
                          else
                            (.status // "UNKNOWN" | ascii_upcase)
                          end
                        )
                        + ": "
                        + (
                          .lhs
                          // .lhsExpr
                          // .expression
                          // "Assertion"
                        )
                        + (
                          if (.rhs // .rhsExpr // .expected // null) != null then
                          " " + ((.rhs // .rhsExpr // .expected) | tostring)
                          else
                          ""
                          end
                        )
                        + (
                            if (.error.message? // "") != "" then
                              "\n  Error: " + .error.message
                            elif (.error? | type) == "string" and .error != "" then
                              "\n  Error: " + .error
                            else
                              ""
                            end
                          )
                      )
                      | join("\n")
                    end
                ')

                echo ""
                echo "=== Parsed Assertions for $TEST_KEY ==="
                printf '%s\n' "$ASSERTION_DETAILS"



                # --------------------------------------------------
                # Build Test Run comment
                # --------------------------------------------------

                COMMENT=$(printf '%s\n' \
                  "Automated API Regression Result" \
                  "" \
                  "Jira Test: $TEST_KEY" \
                  "Bruno Request: $TEST_NAME" \
                  "" \
                  "Result: ${XRAY_STATUS:-UNKNOWN}" \
                  "" \
                  "Request:" \
                  "$METHOD $REQUEST_URL" \
                  "" \
                  "HTTP Status: $HTTP_STATUS" \
                  "Duration: $RUN_DURATION ms" \
                  "" \
                  "Assertions:" \
                  "$ASSERTION_DETAILS" \
                  "" \
                  "Source: GitHub Actions / Bruno CLI")

                echo ""
                echo "=== Comment for $TEST_KEY ==="
                printf '%s\n' "$COMMENT"



                # --------------------------------------------------
                # Update Xray Test Run comment
                # --------------------------------------------------

                MUTATION=$(jq -n \
                  --arg id "$TEST_RUN_ID" \
                  --arg comment "$COMMENT" \
                  '{
                    query: (
                      "mutation { updateTestRun(id: " +
                      ($id | @json) +
                      ", comment: " +
                      ($comment | @json) +
                      ") { warnings } }"
                    )
                  }')

                HTTP_CODE=$(curl -s \
                  -o xray-update-response.json \
                  -w "%{http_code}" \
                  -X POST \
                  -H "Authorization: Bearer ${XRAY_TOKEN}" \
                  -H "Content-Type: application/json" \
                  --data "$MUTATION" \
                  "https://xray.cloud.getxray.app/api/v2/graphql")

                echo "HTTP status: $HTTP_CODE"

                if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
                  echo "ERROR: HTTP failure updating Test Run $TEST_RUN_ID"
                  cat xray-update-response.json
                  FAILED_UPDATE_COUNT=$((FAILED_UPDATE_COUNT + 1))
                  continue
                fi

                if jq -e '.errors? | length > 0' \
                  xray-update-response.json >/dev/null 2>&1; then

                  echo "ERROR: GraphQL failure updating Test Run $TEST_RUN_ID"
                  jq '.errors' xray-update-response.json

                  FAILED_UPDATE_COUNT=$((FAILED_UPDATE_COUNT + 1))
                  continue
                fi

                echo "SUCCESS: Updated Xray Test Run $TEST_RUN_ID"
                UPDATED_COUNT=$((UPDATED_COUNT + 1))

              done < <(
                jq -c '.[].results[]' bruno-results.json
              )

              # --------------------------------------------------
              # Final summary
              # --------------------------------------------------

              echo ""
              echo "========================================"
              echo "=== Xray Test Run Update Summary ==="
              echo "========================================"
              echo "Successfully updated: $UPDATED_COUNT"
              echo "Failed updates:       $FAILED_UPDATE_COUNT"
              echo "Xray Test Runs:       $TEST_RUN_COUNT"
              echo "========================================"

              if [ "$FAILED_UPDATE_COUNT" -gt 0 ]; then
                echo "ERROR: One or more Xray Test Run updates failed."
                exit 1
              fi

              echo ""
              echo "All Xray Test Run comments were updated successfully."


      


      # ----------------------------------------
      # 14. Upload Bruno Results
      # ----------------------------------------

      - name: Upload Bruno Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bruno-results
          path: |
            test-results.xml
            bruno-results.json
            xray-import-response.json
          retention-days: 10

       
      # ----------------------------------------
      # 15. Check Bruno Results
      # ----------------------------------------

      - name: Check Bruno Result
        if: always()
        shell: bash
        env:
          BRUNO_EXIT_CODE: ${{ steps.bruno.outputs.exit_code }}

        run: |
          echo "=== Bruno Regression Final Status ==="
          echo "Bruno exit code: ${BRUNO_EXIT_CODE:-unknown}"

          if [ "${BRUNO_EXIT_CODE:-1}" != "0" ]; then
            echo "AEP API Regression had test failures."
            echo "The available results have been published to Xray."
            exit 0
          fi

          echo "AEP API Regression passed."
          echo "The results have been published to Xray."
